<div id="history-modal-content" class="history-modal" style="display: flex;">
    <div class="modal-overlay" onclick="closeHistoryModal()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3>📋 Historial de Créditos</h3>
            <button onclick="closeHistoryModal()" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <div
                style="margin-bottom: 1rem; padding: 0.75rem; background: rgba(59, 130, 246, 0.1); border-radius: 0.5rem;">
                <strong>{{ programa }}</strong><br>
                <span style="color: #94a3b8; font-size: 0.875rem;">{{ anio }} - T{{ trimestre }} | {{ fuente }}</span>
            </div>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--border-light);">
                        <th style="text-align: left; padding: 0.75rem; color: var(--text-muted); font-weight: 600;">
                            Fecha de
                            Creación</th>
                        <th style="text-align: left; padding: 0.75rem; color: var(--text-muted); font-weight: 600;">
                            Monto</th>
                        <th style="text-align: right; padding: 0.75rem; color: var(--text-muted); font-weight: 600;">
                            Acción</th>
                    </tr>
                </thead>
                <tbody>
                    {% for credito in creditos %}
                    <tr style="border-bottom: 1px solid var(--border-light);">
                        <td style="padding: 0.75rem; color: var(--text-main);">{{ credito.fecha }}</td>
                        <td style="padding: 0.75rem; font-weight: 600; color: var(--primary-blue);">${{ credito.monto }}
                        </td>
                        <td style="padding: 0.75rem; text-align: right;">
                            <a href="{% url 'finance:distribuir_credito' credito.id %}" class="btn btn-primary"
                                style="font-size: 0.875rem; padding: 0.5rem 1rem;">Gestionar</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
                <tfoot>
                    <tr style="border-top: 2px solid var(--border-light);">
                        <td style="padding: 0.75rem; font-weight: 700; color: var(--text-main); text-align: right;">
                            Total Final:
                        </td>
                        <td style="padding: 0.75rem; font-weight: 700; color: var(--primary-blue);">${{
                            final_total_display }}</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<script>
    function closeHistoryModal() {
        document.getElementById('history-modal-content').remove();
        document.body.style.overflow = 'auto';
    }
    // Prevent background scrolling when modal opens
    document.body.style.overflow = 'hidden';
</script>
