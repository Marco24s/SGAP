<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.G.A.P. - Armada Argentina</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=4">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="logo-area">
                <div class="logo-icon">⚓</div>
                <h2>S.G.A.P.</h2>
            </div>
            <nav>
                <a href="{% url 'dashboard:home' %}" class="nav-item">Dashboard</a>
                <a href="{% url 'finance:lista_creditos' %}" class="nav-item">TP - 03 (FOXTROT)</a>
                <a href="{% url 'finance:modificaciones' %}" class="nav-item">Modificaciones</a>
                <a href="{% url 'finance:lista_autorizaciones' %}" class="nav-item">Autorizaciones</a>
                <a href="{% url 'finance:simular_ejecucion' %}" class="nav-item">Ejecución (Simulada)</a>
                <a href="{% url 'dashboard:reporte_estado_mensual' %}" class="nav-item">Reportes</a>
            </nav>
            <!-- Sidebar footer removed -->
        </aside>

        <main class="content-area">
            <header class="top-bar">
                <div class="header-left" style="display: flex; align-items: center; gap: 1rem;">
                    <button id="sidebar-toggle" class="btn-icon" style="background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.5rem; display: flex; align-items: center; justify-content: center; border-radius: 0.5rem; transition: background 0.2s;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="header-title">
                        <h1>
                            <span style="color: var(--primary-blue);">✈</span>
                            Sistema Integral de Gestión
                        </h1>
                    </div>
                </div>
                <div class="user-profile">
                    <a href="{% url 'core:landing' %}" class="btn"
                        style="background-color: var(--primary-blue); color: white;">
                        <span>↩</span> Volver al Inicio
                    </a>
                </div>
            </header>

            <div class="content-wrapper">
                {% if messages %}
                <div class="messages-container" style="margin-bottom: 1.5rem;">
                    {% for message in messages %}
                    <div class="alert"
                        style="padding: 1rem; border-radius: 0.5rem; margin-bottom: 0.5rem; border: 1px solid;
                                {% if message.tags == 'success' %}background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: var(--success);{% endif %}
                                {% if message.tags == 'error' %}background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: var(--danger);{% endif %}
                                {% if message.tags == 'warning' %}background: rgba(245, 158, 11, 0.1); color: var(--warning); border-color: var(--warning);{% endif %}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebar-toggle');
            
            // Check localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                sidebar.classList.add('collapsed');
            }

            toggleBtn.addEventListener('click', function() {
                sidebar.classList.toggle('collapsed');
                localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
            });
        });
    </script>
</body>

</html>
