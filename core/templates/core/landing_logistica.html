<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamento Logística - COAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        :root {
            --primary-blue: #1d4ed8;
            --primary-dark: #1e3a8a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
        }

        body {
            /* Override global dark theme */
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            margin-top: 0;
            letter-spacing: -1px;
            color: var(--primary-dark);
            text-transform: uppercase;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            display: block;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .logo {
            font-size: 5rem;
            margin-bottom: 0.25rem;
            color: var(--primary-blue);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        /* Ensure cards look correct on light theme if style.css optimized them for dark */
        .app-card {
            background: white;
            color: #1e293b;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <a href="{% url 'core:logout' %}" class="btn-top-right">
        <span>↪</span> Cerrar Sesión
    </a>

    <div class="container" style="margin-top: 0vh;"> <!-- Reset visual shift -->
        <header>
            <div class="logo">
                <img src="/static/img/logo_coan.png" alt="Logo COAN" style="max-width: 350px; height: auto;">
            </div>
            <h1>Comando de Aviación Naval</h1>
            <h2>Sistema de Gestión Departamento Logística</h2>
        </header>

        <!-- Apps Grid -->
        <div class="apps-grid">
            <a href="/dashboard/" class="app-card">
                <div class="icon-box">
                    ✈️
                </div>
                <div class="app-title">Ingresar al S.G.A.P.</div>
                <p class="app-desc">Sistema de Gestión Aérea y Presupuestaria del COAN</p>
            </a>

            <a href="{% url 'core:control' %}" class="app-card">
                <div class="icon-box">
                    🛠️
                </div>
                <div class="app-title">Control</div>
                <p class="app-desc">Panel de administración y herramientas</p>
            </a>

            <a href="{% url 'dashboard:bases_decision' %}" class="app-card">
                <div class="icon-box">
                    📊
                </div>
                <div class="app-title">División Bases</div>
                <p class="app-desc">Herramientas para la toma de decisiones</p>
            </a>

            <!-- Future buttons can be added here easily -->

            <!-- Future buttons can be added here easily -->
            <!-- 
            <a href="#" class="app-card">
                <div class="icon-box">📦</div>
                <div class="app-title">Gestión de Pañol</div>
                <p class="app-desc">Control de stock y movimientos</p>
            </a>
            -->
        </div>

    </div>
</body>

</html>
