<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamento Logística - COAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1d4ed8;
            --primary-dark: #1e3a8a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            padding: 2rem;
            animation: fadeIn 1s ease-out;
        }

        .logo {
            font-size: 5rem;
            margin-bottom: 0.25rem;
            /* Reduced from 1rem to bring text closer */
            color: var(--primary-blue);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            margin-top: 0;
            letter-spacing: -1px;
            color: var(--primary-dark);
            text-transform: uppercase;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            display: block;
            /* Stack vertically */
            max-width: 600px;
            /* Limit width for border */
            margin-left: auto;
            margin-right: auto;
        }

        /* Grid System */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            justify-content: center;
        }

        /* Card Style */
        .app-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem 1.5rem;
            /* Reduced padding */
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            /* Reduced gap */
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
            max-width: 300px;
            /* Constrain width */
            margin: 0 auto;
            /* Center in grid cell */
        }

        .app-card:hover {
            transform: translateY(-5px);
            /* Subtle lift */
            box-shadow: 0 20px 40px -12px rgba(29, 78, 216, 0.25);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .icon-box {
            width: 60px;
            /* Smaller icon box */
            height: 60px;
            background: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            /* Smaller icon */
            color: var(--primary-blue);
            margin-bottom: 0.25rem;
            transition: all 0.3s ease;
        }

        .app-card:hover .icon-box {
            background: var(--primary-blue);
            color: white;
            transform: scale(1.1) rotate(5deg);
        }

        .app-title {
            font-size: 1.1rem;
            /* Slightly smaller title */
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .app-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            margin-top: 6rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .btn-top-right {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background-color: #fee2e2;
            color: #ef4444;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.1);
        }

        .btn-top-right:hover {
            background-color: #fecaca;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <a href="{% url 'core:logout' %}" class="btn-top-right">
        <span>↪</span> Cerrar Sesión
    </a>

    <div class="container" style="margin-top: 0vh;"> <!-- Reset visual shift -->
        <header>
            <div class="logo">
                <img src="/static/img/logo_coan.png" alt="Logo COAN" style="max-width: 350px; height: auto;">
            </div>
            <h1>Comando de Aviación Naval</h1>
            <h2>Sistema de Gestión Departamento Logística</h2>
        </header>

        <!-- Apps Grid -->
        <div class="apps-grid">
            <a href="/dashboard/" class="app-card">
                <div class="icon-box">
                    ✈️
                </div>
                <div class="app-title">Ingresar al S.G.A.P.</div>
                <p class="app-desc">Sistema de Gestión Aérea y Presupuestaria del COAN</p>
            </a>

            <a href="{% url 'core:control' %}" class="app-card">
                <div class="icon-box">
                    🛠️
                </div>
                <div class="app-title">Control</div>
                <p class="app-desc">Panel de administración y herramientas</p>
            </a>

            <a href="{% url 'dashboard:bases_decision' %}" class="app-card">
                <div class="icon-box">
                    📊
                </div>
                <div class="app-title">División Bases</div>
                <p class="app-desc">Herramientas para la toma de decisiones</p>
            </a>

            <!-- Future buttons can be added here easily -->
            <!-- 
            <a href="#" class="app-card">
                <div class="icon-box">📦</div>
                <div class="app-title">Gestión de Pañol</div>
                <p class="app-desc">Control de stock y movimientos</p>
            </a>
            -->
        </div>

    </div>
</body>

</html>
