{% extends 'base.html' %}

{% block content %}
<!-- Load Bootstrap Icons (since we are not using Bootstrap JS/CSS framework, we just need the icons) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    /* Custom Layout for Logistica Module */
    .logistica-container {
        display: flex;
        gap: 2rem;
        align-items: flex-start;
        position: relative;
    }

    .logistica-sidebar {
        width: 80px;
        background-color: var(--bg-card);
        border-radius: 1rem;
        padding: 1.5rem 0.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        flex-shrink: 0;
        position: sticky;
        top: 2rem;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-light);
        z-index: 50;
    }

    .logistica-content {
        flex: 1;
        min-width: 0; /* Prevent flex blowout */
        animation: fadeIn 0.3s ease-out;
    }

    /* Navigation Buttons */
    .log-nav-btn {
        width: 54px;
        height: 54px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        color: var(--text-muted);
        text-decoration: none;
        transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        background: transparent;
    }

    .log-nav-btn i {
        font-size: 1.6rem;
        margin-bottom: 0;
        transition: transform 0.2s;
    }

    .log-nav-btn:hover {
        background-color: rgba(59, 130, 246, 0.08);
        color: var(--primary-blue);
        transform: translateY(-2px);
    }
    
    .log-nav-btn:hover i {
        transform: scale(1.1);
    }

    /* Active State */
    .log-nav-btn.active {
        background: linear-gradient(135deg, var(--primary-blue), var(--primary-dark));
        color: white;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    /* Tooltip text on hover (simple CSS implementation) */
    .log-nav-btn::after {
        content: attr(data-title);
        position: absolute;
        left: 70px; /* Right of the sidebar */
        background: var(--bg-body);
        color: var(--text-main);
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.85rem;
        font-weight: 500;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        transition: all 0.2s;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-light);
        pointer-events: none;
        z-index: 100;
        transform: translateX(-10px);
    }

    .log-nav-btn:hover::after {
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
    }
    
    /* Animation */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="logistica-container">
    <!-- Compact Icon Sidebar -->
    <aside class="logistica-sidebar">
        <!-- Module Icon -->
        <div class="mb-2 text-primary">
            <i class="bi bi-grid-fill fs-3"></i>
        </div>
        
        <div style="width: 100%; height: 1px; background: var(--border-light); margin: 0.5rem 0;"></div>

        <!-- Navigation Links -->
        <a href="{% url 'logistica:index' %}" class="log-nav-btn {% if request.resolver_match.url_name == 'index' %}active{% endif %}" data-title="Panel Principal">
            <i class="bi bi-speedometer2"></i>
        </a>
        
        <a href="{% url 'logistica:personal_list' %}" class="log-nav-btn {% if 'personal' in request.path %}active{% endif %}" data-title="Gestión de Personal">
            <i class="bi bi-people"></i>
        </a>
        
        <a href="{% url 'logistica:prenda_list' %}" class="log-nav-btn {% if 'prendas' in request.path and 'tipo' not in request.path %}active{% endif %}" data-title="Inventario de Prendas">
            <i class="bi bi-box-seam"></i>
        </a>
        
        <a href="{% url 'logistica:asignacion_list' %}" class="log-nav-btn {% if 'asignaciones' in request.path %}active{% endif %}" data-title="Asignaciones">
            <i class="bi bi-clipboard-check"></i>
        </a>
        
        <a href="{% url 'logistica:estado_dotacion' %}" class="log-nav-btn {% if 'dotacion' in request.path or 'tipo' in request.path %}active{% endif %}" data-title="Control de Dotación">
            <i class="bi bi-shield-check"></i>
        </a>
    </aside>

    <!-- Main Content -->
    <main class="logistica-content">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} shadow-sm mb-4">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block logistica_content %}
        <!-- Content specific to each view goes here -->
        {% endblock %}
    </main>
</div>
{% endblock %}
